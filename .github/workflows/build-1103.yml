name: Build MosDNS Full Suite (25.12 APK Format)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt 25.12.2 SDK (ramips/mt7621 -> mipsel_24kc)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-sdk-25.12.2-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst || tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Prepare Feeds and Source
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -r ../mosdns package/
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          # 核心修复 1：强制启用 golang 支持，这是编译 mosdns 的前提！
          echo "CONFIG_PACKAGE_golang=y" >> .config
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m" >> .config
          make defconfig

      - name: Compile Packages
        run: |
          cd sdk
          # 核心修复 2：加入 set -e，任何一行报错立刻停止，防止错误被掩盖！
          set -e 
          
          export GOPROXY=https://goproxy.cn,direct
          export GOMODCACHE=$PWD/dl/go-mod
          
          # 核心修复 3：先下载源码和依赖，防止编译时网络超时
          make package/mosdns/download V=s
          
          # 编译核心
          make package/mosdns/compile V=s
          
          # 编译 UI
          make package/luci-app-mosdns/compile V=s

      - name: Collect Target APKs
        run: |
          mkdir -p output
          find sdk/bin/packages/ -type f \( -name "mosdns_*mipsel_24kc*" -o -name "luci-app-mosdns_*all*" -o -name "luci-i18n-mosdns-zh-cn_*all*" \) -exec cp {} output/ \;
          find sdk/bin/packages/ -type f \( -name "mosdns_*.apk" -o -name "luci-app-mosdns*.apk" -o -name "luci-i18n-mosdns*.apk" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-full-suite-25.12-apk
          path: output/*
