name: Build MosDNS Full Suite (25.12 APK Format) - FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt 25.12.2 SDK (ramips/mt7621 -> mipsel_24kc)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-sdk-25.12.2-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst || tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Prepare Feeds and Source (🔥 最终修复：更新所有 Feed)
        run: |
          cd sdk
          # 核心修复：使用 -a 更新并安装所有 feed！
          # 这样既包含了 golang-package.mk (来自 packages)，也包含了 luci.mk (来自 luci)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 复制源码
          cp -r ../mosdns package/
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          make defconfig
          # 选中这三个包
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m" >> .config
          # 强制启用 golang 支持
          echo "CONFIG_PACKAGE_golang=y" >> .config
          make defconfig

      - name: Compile Packages (🔥 保持严格模式)
        run: |
          cd sdk
          # 保持 set -e，任何报错立刻标红
          set -e
          
          export GOPROXY=https://goproxy.cn,direct
          export GOMODCACHE=$PWD/dl/go-mod
          
          # 1. 必须先编译好宿主机的 Go 环境
          make package/golang/host/compile V=s
          
          # 2. 下载 mosdns 源码
          make package/mosdns/download V=s
          
          # 3. 编译 mosdns 核心
          make package/mosdns/compile V=s
          
          # 4. 编译 luci 前端
          make package/luci-app-mosdns/compile V=s

      - name: Collect Target APKs (🔥 暴力收集所有 APK)
        run: |
          mkdir -p output
          
          # 25.12 的 apk 命名规则是横杠 (-) 而不是下划线 (_)！
          # 我们不再精准匹配，直接暴力抓取 bin/packages 和 bin/targets 目录下所有的 .apk 文件！
          find sdk/bin/packages/ -type f -name "*.apk" -exec cp {} output/ \;
          find sdk/bin/targets/ -type f -name "*.apk" -exec cp {} output/ \;
          
          # 打印出来看看究竟生成了哪些文件
          echo "=== 成功收集的 APK 文件列表 ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-full-suite-25.12-apk-final
          path: output/*
