name: Build MosDNS IPK (ImmortalWrt 24.10.6 MT7621)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 修复：移除了已废弃的 python3-distutils，替换为 python3-setuptools 和 python3-dev
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt 24.10.6 SDK for MT7621
        run: |
          # 官方 24.10.6 MT7621 SDK 链接 (.tar.zst 格式)
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/ramips/mt7621/immortalwrt-sdk-24.10.6-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          # 使用 zstd 解压
          tar --use-compress-program=unzstd -xf sdk.tar.zst || tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Prepare Feeds and Source
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 将仓库里的 mosdns 核心和 luci 前端复制到 SDK 的 package 目录
          cp -r ../mosdns package/
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          make defconfig
          # 强制选中这两个包进行编译
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          make defconfig

      - name: Compile Packages
        run: |
          cd sdk
          # 设置 Go 代理，防止下载依赖时超时
          export GOPROXY=https://goproxy.cn,direct
          export GOMODCACHE=$PWD/dl/go-mod
          
          # 编译核心和 UI
          make package/mosdns/compile V=s
          make package/luci-app-mosdns/compile V=s

      - name: Collect IPKs
        run: |
          mkdir -p output
          # 收集所有生成的 ipk 文件
          find sdk/bin/packages/ -name "*.ipk" -exec cp {} output/ \;
          find sdk/bin/targets/ -name "*.ipk" -exec cp {} output/ \;
          ls -lh output/

      - name: Upload IPKs
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-vitoegg-24.10.6-ipks
          path: output/*.ipk
