name: Build mosdns + luci-app (ImmortalWrt 25.12.2 apk)

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose build log (V=s)"
        default: false
        type: boolean
  push:
    paths:
      - "mosdns/**"
      - "luci-app-mosdns/**"
      - ".github/workflows/build.yml"

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-sdk-25.12.2-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  CACHE_KEY: immortalwrt-sdk-25.12.2-ramips-mt7621-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Restore build cache (dl / staging_dir / build_dir)
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/staging_dir
            sdk/build_dir
            sdk/tmp
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_KEY }}

      - name: Download and extract SDK
        run: |
          # 缓存恢复可能已预创建 sdk/（装着 dl/staging_dir 等），必须合并而非改名
          mkdir -p sdk
          wget -q -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          rsync -a immortalwrt-sdk-*/ sdk/
          rm -rf immortalwrt-sdk-*
          # SDK 压缩包不带 .config（由下一步的 make defconfig 现场生成），只查关键脚本
          ls sdk/scripts/feeds sdk/include/toplevel.mk >/dev/null && echo "SDK 就绪"

      - name: Prepare feeds and copy packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 删除官方 feed 自带版本，防止包名冲突
          rm -rf package/feeds/packages/mosdns
          rm -rf package/feeds/luci/applications/luci-app-mosdns
          rm -rf package/feeds/luci/i18n/mosdns
          cp -r ../mosdns package/
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          make defconfig
          # 保险措施：显式关掉 SDK 的全量选择开关，防止意外编译几百个 kmod
          sed -i 's/^CONFIG_ALL=.*/# CONFIG_ALL is not set/' .config
          sed -i 's/^CONFIG_ALL_KMODS=.*/# CONFIG_ALL_KMODS is not set/' .config
          sed -i 's/^CONFIG_ALL_NONSHARED=.*/# CONFIG_ALL_NONSHARED is not set/' .config
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m" >> .config
          echo "CONFIG_PACKAGE_golang=y" >> .config
          make defconfig

      - name: Compile core packages (mosdns + luci-app)
        run: |
          cd sdk
          export GOMODCACHE=$PWD/dl/go-mod
          VFLAG=""
          [ "${{ inputs.debug }}" = "true" ] && VFLAG="V=s"
          make -j$(nproc) $VFLAG package/mosdns/compile package/luci-app-mosdns/compile

      # luci-i18n-mosdns-zh-cn 是 luci.mk 在本目录生成的子包，没有独立的
      # package/<name>/compile target；只要 .config 中选中（见 Configure SDK），
      # 它会在上面的 luci-app-mosdns 编译时一并出包
      - name: Collect APKs
        run: |
          mkdir -p output
          find sdk/bin/packages/ -type f \
            \( -name "mosdns-*.apk" -o -name "luci-app-mosdns-*.apk" \
               -o -name "luci-i18n-mosdns-zh-cn-*.apk" \) \
            -exec cp {} output/ \;
          echo "=== collected ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-suite-25.12-apk
          path: output/*
