name: Build mosdns + luci-app (ImmortalWrt 25.12.2 apk)

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose build log (V=s)"
        default: false
        type: boolean
  push:
    paths:
      - "mosdns/**"
      - "luci-app-mosdns/**"
      - ".github/workflows/build.yml"

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-sdk-25.12.2-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  CACHE_KEY: immortalwrt-sdk-25.12.2-ramips-mt7621-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pip python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Restore build cache (dl / staging_dir / build_dir)
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/staging_dir
            sdk/build_dir
            sdk/tmp
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_KEY }}

      - name: Download and extract SDK
        run: |
          # 缓存恢复可能已预创建 sdk/（装着 dl/staging_dir 等），必须合并而非改名
          mkdir -p sdk
          wget -q -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          rsync -a immortalwrt-sdk-*/ sdk/
          rm -rf immortalwrt-sdk-*
          # SDK 压缩包不带 .config（由下一步的 make defconfig 现场生成），只查关键脚本
          ls sdk/scripts/feeds sdk/include/toplevel.mk >/dev/null && echo "SDK 就绪"

      - name: Prepare feeds and copy packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 删除官方 feed 自带版本，防止包名冲突
          rm -rf package/feeds/packages/mosdns
          rm -rf package/feeds/luci/applications/luci-app-mosdns
          rm -rf package/feeds/luci/i18n/mosdns
          cp -r ../mosdns package/
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          make defconfig
          # 保险措施：显式关掉 SDK 的全量选择开关，防止意外编译几百个 kmod
          sed -i 's/^CONFIG_ALL=.*/# CONFIG_ALL is not set/' .config
          sed -i 's/^CONFIG_ALL_KMODS=.*/# CONFIG_ALL_KMODS is not set/' .config
          sed -i 's/^CONFIG_ALL_NONSHARED=.*/# CONFIG_ALL_NONSHARED is not set/' .config
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m" >> .config
          echo "CONFIG_PACKAGE_golang=y" >> .config
          # 只编软件包不编镜像：目标默认包里的 u-boot 全部显式排除。
          # uboot-mediatek 的 prereq（include/u-boot.mk）会连跑 python3-dev/
          # setuptools/swig 一串宿主检查，与我们要编的包毫无关系
          sed -i 's/^CONFIG_PACKAGE_uboot-\([^=]*\)=y/# CONFIG_PACKAGE_uboot-\1 is not set/' .config
          make defconfig
          echo "=== 诊断：uboot 最终选中状态 ==="
          grep '^CONFIG_PACKAGE_uboot' .config | head -10 || echo "(uboot 未被选中)"
          echo "=== 诊断：mosdns/luci 选中状态 ==="
          grep '^CONFIG_PACKAGE_mosdns=\|^CONFIG_PACKAGE_luci-app-mosdns=\|^CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=\|^CONFIG_PACKAGE_golang=' .config

      - name: Patch host python setuptools
        run: |
          # u-boot.mk 的 prereq 检查跑 $(STAGING_DIR_HOST)/bin/python3 -c 'import setuptools'。
          # 覆盖全部失败形态：宿主 python 缺失 → 软链系统 python3；
          # 存在但缺 setuptools → ensurepip / pip / pip --target 逐级补装；
          # 最后强断言，失败即红、原因可见，不再静默吞错
          mkdir -p sdk/staging_dir/host/bin
          HPY=sdk/staging_dir/host/bin/python3
          if [ ! -x "$HPY" ]; then
            echo "宿主 python 不存在，软链系统 python3"
            ln -sf "$(command -v python3)" "$HPY"
          fi
          "$HPY" --version
          if ! "$HPY" -c 'import setuptools' 2>/dev/null; then
            echo "setuptools 缺失，开始补装..."
            "$HPY" -m ensurepip --upgrade 2>&1 | tail -1 || true
            "$HPY" -m pip install -q setuptools 2>/dev/null || {
              SP="$("$HPY" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])' 2>/dev/null || true)"
              [ -z "$SP" ] && SP="$("$HPY" -c 'import sys; print(sys.prefix + "/lib/python" + str(sys.version_info[0]) + "." + str(sys.version_info[1]) + "/site-packages")' 2>/dev/null || true)"
              echo "pip 不可用，用系统 pip --target 装到: ${SP:-未知}"
              python3 -m pip install -q --target "$SP" setuptools
            }
          fi
          "$HPY" -c 'import setuptools' && echo "host python setuptools OK ($("$HPY" -c 'import setuptools,sys; print(setuptools.__version__)'))" \
            || { echo "::error::宿主 python 补装 setuptools 失败"; exit 1; }

      - name: Compile core packages (mosdns + luci-app)
        run: |
          cd sdk
          export GOMODCACHE=$PWD/dl/go-mod
          VFLAG=""
          [ "${{ inputs.debug }}" = "true" ] && VFLAG="V=s"
          make -j$(nproc) $VFLAG package/mosdns/compile package/luci-app-mosdns/compile

      # luci-i18n-mosdns-zh-cn 是 luci.mk 在本目录生成的子包，没有独立的
      # package/<name>/compile target；只要 .config 中选中（见 Configure SDK），
      # 它会在上面的 luci-app-mosdns 编译时一并出包
      - name: Collect APKs
        run: |
          mkdir -p output
          find sdk/bin/packages/ -type f \
            \( -name "mosdns-*.apk" -o -name "luci-app-mosdns-*.apk" \
               -o -name "luci-i18n-mosdns-zh-cn-*.apk" \) \
            -exec cp {} output/ \;
          echo "=== collected ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-suite-25.12-apk
          path: output/*
