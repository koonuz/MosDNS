name: Build LuCI-App-MosDNS Only (Any Arch)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 安装编译 OpenWrt 包所需的基础工具
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt 24.10.6 SDK for MT7621
        run: |
          # 依然使用 SDK，因为 LuCI 的打包需要依赖 SDK 里的基础构建环境 (如 luci-base)
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/ramips/mt7621/immortalwrt-sdk-24.10.6-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst || tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Prepare Feeds and Source
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 核心修改：只复制 luci 前端目录，不复制 mosdns 核心目录
          cp -r ../luci-app-mosdns package/

      - name: Configure SDK
        run: |
          cd sdk
          make defconfig
          # 只选中 luci 前端进行编译
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config
          make defconfig

      - name: Compile LuCI Package Only
        run: |
          cd sdk
          # 只编译前端，不需要设置 Go 代理，速度极快
          make package/luci-app-mosdns/compile V=s

      - name: Collect IPKs and APKs
        run: |
          mkdir -p output
          # 收集生成的 luci 前端包 (兼容 ipk 和 24.10 可能生成的 apk 格式)
          find sdk/bin/packages/ -name "luci-app-mosdns*" -exec cp {} output/ \;
          find sdk/bin/targets/ -name "luci-app-mosdns*" -exec cp {} output/ \;
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mosdns-only
          path: output/*
