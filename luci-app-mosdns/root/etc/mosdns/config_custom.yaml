log:
  level: info
  file: "/var/log/mosdns.log"

# API 入口设置
api:
  http: "0.0.0.0:9091"

include: []

plugins:
  # 统计收集器
  - tag: stats_collector
    type: stats_api
    args:
      capacity: 2000                      # 查询日志环缓冲区容量 (FIFO 覆盖)
      dump_file: "/etc/mosdns/stats.dump" # 数据持久化转存文件路径，不设置则不转存
      dump_interval: 600                  # 周期性转储间隔（秒）

  # 缓存
  - tag: lazy_cache
    type: cache
    args:
      size: 20000
      lazy_cache_ttl: 86400
      dump_file: "/etc/mosdns/cache.dump"
      dump_interval: 600

  # 转发至本地服务器
  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: "https://doh.pub/dns-query"
          bootstrap: 180.76.76.76
        - addr: 119.29.29.29

  # 转发至远程服务器
  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: tls://8.8.8.8
          enable_pipeline: false

  # 国内解析
  - tag: local_sequence
    type: sequence
    args:
      - exec: $forward_local

  # 国外解析
  - tag: remote_sequence
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_remote

  # 有响应终止返回
  - tag: has_resp_sequence
    type: sequence
    args:
      - matches: has_resp
        exec: accept

  # 分流示例：不再依赖 geosite/geoip 数据文件。
  # 如需按域名/IP 分流，请在 /etc/mosdns/rule/ 下放置纯文本规则文件，
  # 用 domain_set / ip_set 插件引用它们（文件不存在会导致 mosdns 启动失败）。
  # 下方保留 forward_remote / remote_sequence 作为扩展分流时的现成积木。

  # 主要的运行逻辑插件
  # sequence 插件中调用的插件 tag 必须在 sequence 前定义，
  # 否则 sequence 找不到对应插件。
  - tag: main_sequence
    type: sequence
    args:
      - exec: $stats_collector           # 执行全局统计控制器
      - exec: $lazy_cache
      - exec: jump has_resp_sequence
      - exec: $local_sequence

  # 启动 udp 服务器。
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: ":5335"

  # 启动 tcp 服务器。
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: ":5335"
